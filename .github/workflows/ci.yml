name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          # Windows caught Store.compact() unlinking an open file handle —
          # keep it in the matrix permanently.
          - { os: windows-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v4

      - name: git identity (the vault commits, so git needs a name)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: zero dependencies by design (run without pytest first)
        run: python -m unittest discover -s tests

      - run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: full suite
        run: python -m pytest -q

      - name: CLI end-to-end
        shell: bash
        run: |
          set -eux
          TMP=$(mktemp -d); cd "$TMP"
          cairn --help > /dev/null
          cairn init my-wiki
          cairn record my-wiki alice role admin --valid-from 2020-01-01 --recorder alice
          cairn get my-wiki alice role
          cairn record my-wiki alice role engineer --valid-from 2022-01-01 --recorder alice
          cairn history my-wiki alice | head
          cairn verify my-wiki
          cairn stats my-wiki

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build twine
      - name: build sdist and wheel
        run: python -m build
      - name: twine check
        run: python -m twine check dist/*
      - name: install the wheel in a clean venv (no deps) and use it
        run: |
          set -eux
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import cairn; print('cairn', cairn.__version__)"
          /tmp/venv/bin/cairn --help > /dev/null
          /tmp/venv/bin/python -m unittest discover -s tests
      - name: no generated artifacts tracked
        run: |
          if git ls-files | grep -Eq '__pycache__|\.pyc$'; then
            echo "generated artifacts are tracked"; exit 1
          fi
          echo clean

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "1.0.1"
description = "Local-first shared memory: everything is a content-addressed claim; the database is a directory; merging is a set union."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cairn" }]
keywords = ["local-first", "crdt", "bitemporal", "knowledge-graph", "claims", "database"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

# Zero runtime dependencies by design: pure Python standard library.
dependencies = []

[project.scripts]
cairn = "cairn.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["cairn"]

[tool.setuptools.package-data]
cairn = ["py.typed"]
